name: Apply Datihan role UI patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch role view-only behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('js/main.js')
          s=p.read_text()
          if "const DATIHAN_READ_ONLY_SHOP_OWNER" not in s:
              marker="  // ---------------- CART (ACCOUNT-BASED / SUPABASE) ----------------"
              insert="""  // ---------------- SHOP OWNER VIEW-ONLY MODE ----------------\n  let DATIHAN_READ_ONLY_SHOP_OWNER = false;\n  async function updateShopOwnerViewMode(user){\n    DATIHAN_READ_ONLY_SHOP_OWNER = false;\n    const cartButton = document.getElementById('cartBtn');\n    if(cartButton) cartButton.style.display='';\n    if(!user) return;\n    const { data:profile } = await supabaseClient.from('profiles').select('role').eq('id',user.id).single();\n    if(profile?.role !== 'shop_owner') return;\n    DATIHAN_READ_ONLY_SHOP_OWNER = true;\n    if(cartButton){ cartButton.style.display='none'; cartButton.setAttribute('aria-hidden','true'); }\n    renderShopGrid();\n  }\n\n"""
              if marker not in s: raise SystemExit('main.js marker not found')
              s=s.replace(marker,insert+marker,1)
          s=s.replace("  async function addToCart(id){\n    const p = findProduct(id);", "  async function addToCart(id){\n    if(DATIHAN_READ_ONLY_SHOP_OWNER) return;\n    const p = findProduct(id);",1)
          old="""        + '<button class=\"add-btn\" data-add=\"'+escapeHtml(p.id)+'\" '+(p.soldOut?'disabled':'')+'>'+(p.soldOut ? 'Sold out' : (inCart ? 'Already in cart' : 'Add to cart'))+'</button>\n"""
          new="""        + (DATIHAN_READ_ONLY_SHOP_OWNER ? '' : '<button class=\"add-btn\" data-add=\"'+escapeHtml(p.id)+'\" '+(p.soldOut?'disabled':'')+'>'+(p.soldOut ? 'Sold out' : (inCart ? 'Already in cart' : 'Add to cart'))+'</button>')\n"""
          if old not in s: raise SystemExit('render button marker not found')
          s=s.replace(old,new,1)
          marker2="  supabaseClient.auth.onAuthStateChange(async (_event, session) => {\n    const user = session?.user || null;"
          repl2="  supabaseClient.auth.onAuthStateChange(async (_event, session) => {\n    const user = session?.user || null;\n    await updateShopOwnerViewMode(user);"
          if marker2 not in s: raise SystemExit('auth marker not found')
          s=s.replace(marker2,repl2,1)
          p.write_text(s)
          PY
      - name: Remove any legacy Orders tab from shop owner page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('shop-owner.html')
          s=p.read_text()
          s=s.replace('<button id="navOrders">Orders</button>','')
          p.write_text(s)
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/datihan-view-only-patch.yml
          git add js/main.js shop-owner.html .github/workflows/datihan-view-only-patch.yml
          git diff --cached --quiet || git commit -m "Make shop owner storefront view-only"
          git push
