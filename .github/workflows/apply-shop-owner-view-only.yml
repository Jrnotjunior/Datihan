name: Apply Datihan shop owner view-only patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply view-only storefront and hide legacy Orders tab
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          s = index.read_text()
          marker = '<script id="shop-owner-view-only-patch">'
          if marker not in s:
              script = r'''<script id="shop-owner-view-only-patch">
          (async function(){
            try{
              const SUPABASE_URL='https://kymtqzyatofclfaeegfw.supabase.co';
              const SUPABASE_KEY='sb_publishable_2gwFi5f702YC_-py8PGxPw_z6iW67MN';
              if(!window.supabase) return;
              const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
              const {data:{user}}=await client.auth.getUser();
              if(!user) return;
              const {data:profile}=await client.from('profiles').select('role').eq('id',user.id).single();
              if(profile?.role!=='shop_owner') return;

              function makeViewOnly(){
                const cart=document.getElementById('cartBtn');
                if(cart){ cart.style.display='none'; cart.setAttribute('aria-hidden','true'); }
                document.querySelectorAll('[data-add], .add-btn').forEach(el=>el.remove());
              }
              makeViewOnly();
              new MutationObserver(makeViewOnly).observe(document.body,{childList:true,subtree:true});
            }catch(err){ console.error('Shop owner view-only mode failed:',err); }
          })();
          </script>
          '''
              s=s.replace('</body>',script+'</body>',1)
              index.write_text(s)

          owner = Path('shop-owner.html')
          s = owner.read_text()
          marker = '<script id="shop-owner-hide-orders">'
          if marker not in s:
              script = r'''<script id="shop-owner-hide-orders">
          (function(){
            function hideOrders(){
              document.querySelectorAll('button,a').forEach(function(el){
                if((el.textContent||'').trim().toLowerCase()==='orders') el.remove();
              });
            }
            hideOrders();
            new MutationObserver(hideOrders).observe(document.body,{childList:true,subtree:true});
          })();
          </script>
          '''
              s=s.replace('</body>',script+'</body>',1)
              owner.write_text(s)

          Path('.github/workflows/datihan-view-only-patch.yml').unlink(missing_ok=True)
          Path('.github/workflows/apply-shop-owner-view-only.yml').unlink(missing_ok=True)
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html shop-owner.html .github/workflows/datihan-view-only-patch.yml .github/workflows/apply-shop-owner-view-only.yml
          git diff --cached --quiet || git commit -m "Make shop owner storefront view-only"
          git push
