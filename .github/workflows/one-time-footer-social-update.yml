name: One-time footer social update

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-footer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update footer social icons
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')

          pattern = re.compile(r'<h3>Follow along</h3>\s*<ul class="foot-links">.*?</ul>', re.S)
          replacement = '''<h3>Follow along</h3>
          <div class="footer-social-icons" aria-label="Datihan social media">
            <a class="footer-social-icon" href="https://www.instagram.com/datihan.ph" target="_blank" rel="noopener" aria-label="Instagram" title="Instagram">
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1" fill="currentColor" stroke="none"/></svg>
            </a>
            <a class="footer-social-icon" href="https://www.tiktok.com/@datihan.ph" target="_blank" rel="noopener" aria-label="TikTok" title="TikTok">
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 4v10.2a3.8 3.8 0 1 1-3.8-3.8"/><path d="M14 4c0 2.6 2.1 4.7 4.7 4.7"/></svg>
            </a>
            <a class="footer-social-icon" href="https://www.facebook.com/profile.php?id=61577434115016" target="_blank" rel="noopener" aria-label="Facebook" title="Facebook">
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M13.6 21v-7.1h2.6l.4-3h-3V9c0-.9.3-1.5 1.6-1.5h1.7V4.8c-.3 0-1.4-.2-2.6-.2-2.6 0-4.4 1.6-4.4 4.5v1.8H7v3h2.9V21h3.7z"/></svg>
            </a>
          </div>'''

          if not pattern.search(text):
              raise SystemExit('Footer Follow along block was not found; no changes made.')

          text = pattern.sub(replacement, text, count=1)
          index.write_text(text, encoding='utf-8')

          css = Path('css/style.css')
          css_text = css.read_text(encoding='utf-8')
          marker = '.footer-social-icons{'
          if marker not in css_text:
              css_text += '''\n\n/* Footer social icons */\n.footer-social-icons{display:flex;align-items:center;gap:10px;margin-top:14px;}\n.footer-social-icon{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;color:inherit;border:1px solid currentColor;text-decoration:none;transition:transform .18s ease,opacity .18s ease;}\n.footer-social-icon svg{width:18px;height:18px;display:block;}\n.footer-social-icon:hover{transform:translateY(-2px);opacity:.8;}\n.footer-social-icon:focus-visible{outline:2px solid currentColor;outline-offset:3px;}\n'''
              css.write_text(css_text, encoding='utf-8')
          PY

      - name: Commit site changes and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html css/style.css
          git rm .github/workflows/one-time-footer-social-update.yml
          git diff --cached --quiet && exit 0
          git commit -m "Add Facebook and icon-only social links to footer"
          git push
