name: Apply Datihan buyer update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/datihan-buyer-update.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch buyer storefront
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='''  .item-card.sold-out::after{ content:"Sold"; position:absolute; top:14px; left:14px; font-family:'IBM Plex Mono'; font-size:.65rem; background:var(--ink); color:var(--bg); padding:3px 8px; border-radius:2px; }\n  .no-results{ color:var(--ink-soft); padding:40px 0; text-align:center; display:none; }'''
          new='''  .item-card.sold-out::after{ content:"Sold"; position:absolute; top:14px; left:14px; font-family:'IBM Plex Mono'; font-size:.65rem; background:var(--ink); color:var(--bg); padding:3px 8px; border-radius:2px; }\n  .item-card .view-btn{ margin-top:8px; width:100%; background:none; color:var(--ink); border:1px solid var(--line); padding:.55rem; font-weight:500; font-size:.82rem; cursor:pointer; border-radius:2px; }\n  .item-card .view-btn:hover{ border-color:var(--accent); color:var(--accent); }\n  .item-card .description-preview{ color:var(--ink-soft); font-size:.82rem; margin-top:9px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }\n  .product-backdrop{ position:fixed; inset:0; background:rgba(20,18,14,.58); z-index:95; display:none; align-items:center; justify-content:center; padding:20px; }\n  .product-backdrop.open{ display:flex; }\n  .product-modal{ width:min(900px,100%); max-height:min(90vh,900px); overflow:auto; background:var(--plate); color:var(--ink); border:1px solid var(--line); box-shadow:0 24px 70px var(--shadow); }\n  .product-modal-head{ display:flex; justify-content:space-between; align-items:center; gap:18px; padding:18px 22px; border-bottom:1px solid var(--line); position:sticky; top:0; background:color-mix(in srgb,var(--plate) 94%,transparent); backdrop-filter:blur(6px); z-index:2; }\n  .product-modal-head h2{ font-size:1.5rem; }\n  .product-close{ border:0; background:none; color:var(--ink); font-size:1.5rem; cursor:pointer; line-height:1; }\n  .product-modal-body{ display:grid; grid-template-columns:minmax(0,1.05fr) minmax(280px,.95fr); gap:28px; padding:24px; }\n  .product-gallery-main{ width:100%; aspect-ratio:1/1; object-fit:cover; background:var(--panel); border:1px solid var(--line); }\n  .product-gallery-placeholder{ width:100%; aspect-ratio:1/1; background:var(--panel); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; }\n  .product-thumbs{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:10px; }\n  .product-thumb{ aspect-ratio:1; border:1px solid var(--line); background:var(--panel); padding:0; cursor:pointer; overflow:hidden; }\n  .product-thumb[aria-selected="true"]{ border:2px solid var(--accent); }\n  .product-thumb img{ width:100%; height:100%; object-fit:cover; }\n  .product-info .tag-font{ color:var(--ink-soft); font-size:.78rem; }\n  .product-info h3{ font-family:'Barlow Condensed'; text-transform:uppercase; font-size:2.2rem; line-height:1; margin:7px 0 12px; }\n  .product-info .product-price{ font-family:'IBM Plex Mono'; color:var(--accent); font-size:1.25rem; margin:14px 0; }\n  .product-info .product-meta{ color:var(--ink-soft); font-size:.9rem; padding:12px 0; border-top:1px dashed var(--line); border-bottom:1px dashed var(--line); }\n  .product-info .product-description{ margin:18px 0; white-space:pre-wrap; color:var(--ink-soft); font-size:.92rem; }\n  .product-info .product-description strong{ display:block; color:var(--ink); font-family:'Barlow Condensed'; text-transform:uppercase; font-size:1rem; margin-bottom:6px; }\n  @media(max-width:760px){ .product-modal-body{ grid-template-columns:1fr; padding:16px; gap:20px; } .product-info h3{ font-size:1.9rem; } }\n  .no-results{ color:var(--ink-soft); padding:40px 0; text-align:center; display:none; }'''
          assert old in s; s=s.replace(old,new,1)
          anchor='''<!-- CART DRAWER -->'''
          insert='''<!-- PRODUCT DETAILS -->\n<div class="product-backdrop" id="productBackdrop" aria-hidden="true">\n  <section class="product-modal" role="dialog" aria-modal="true" aria-labelledby="productModalTitle">\n    <div class="product-modal-head">\n      <h2 class="display" id="productModalTitle">Item details</h2>\n      <button class="product-close" id="closeProduct" aria-label="Close item details">&times;</button>\n    </div>\n    <div class="product-modal-body" id="productModalBody"></div>\n  </section>\n</div>\n\n<!-- CART DRAWER -->'''
          assert anchor in s; s=s.replace(anchor,insert,1)
          old='''  let PRODUCTS = [];\n\n  async function loadProducts(){'''
          new='''  let PRODUCTS = [];\n\n  function normalizeImageUrls(item){\n    const raw = item?.image_urls;\n    if(Array.isArray(raw)) return raw.filter(Boolean).slice(0,8);\n    if(typeof raw === 'string' && raw.trim()){\n      try{ const parsed = JSON.parse(raw); if(Array.isArray(parsed)) return parsed.filter(Boolean).slice(0,8); }catch(e){}\n      return raw.split(',').map(x => x.trim()).filter(Boolean).slice(0,8);\n    }\n    return item?.image_url ? [item.image_url] : [];\n  }\n\n  async function loadProducts(){'''
          assert old in s; s=s.replace(old,new,1)
          old='''    PRODUCTS = (data || []).map(item => ({\n      id: String(item.id),\n      itemCode: item.item_code || String(item.id).slice(0,8).toUpperCase(),\n      name: item.name || 'Untitled item',\n      category: String(item.category || 'other').toLowerCase(),\n      size: item.size || 'One size',\n      condition: item.condition || 'Good condition',\n      price: Number(item.price || 0),\n      image: item.image_url || '',\n      badge: item.status === 'available' ? 'AVAILABLE' : '',\n      soldOut: item.status === 'sold'\n    }));'''
          new='''    PRODUCTS = (data || []).map(item => {\n      const images = normalizeImageUrls(item);\n      return {\n        id: String(item.id),\n        itemCode: item.item_code || String(item.id).slice(0,8).toUpperCase(),\n        name: item.name || 'Untitled item',\n        category: String(item.category || 'other').toLowerCase(),\n        size: item.size || 'One size',\n        condition: item.condition || 'Good condition',\n        price: Number(item.price || 0),\n        image: images[0] || '',\n        images,\n        description: item.description || '',\n        badge: item.status === 'available' ? 'AVAILABLE' : '',\n        soldOut: item.status === 'sold'\n      };\n    });'''
          assert old in s; s=s.replace(old,new,1)
          s=s.replace("      const matchesText = !q || p.name.toLowerCase().includes(q) || p.category.includes(q);","      const matchesText = !q || p.name.toLowerCase().includes(q) || p.category.includes(q) || p.itemCode.toLowerCase().includes(q);",1)
          old='''      const safeCode = escapeHtml(p.itemCode);\n      return '<div class="item-card'+(p.soldOut?' sold-out':'')+'" data-id="'+escapeHtml(p.id)+'">'\n        + badge\n        + media\n        + '<h3>'+safeName+'</h3>'\n        + '<div class="meta">'+safeSize+' · '+safeCondition+' · '+safeCategory+'</div>'\n        + '<div class="price"><span class="tag-font">#'+safeCode+'</span><span class="amt">'+peso(p.price)+'</span></div>'\n        + '<button class="add-btn" data-add="'+escapeHtml(p.id)+'" '+(p.soldOut?'disabled':'')+'>'+(p.soldOut ? 'Sold out' : (inCart ? 'Added ('+inCart+') · Add another' : 'Add to cart'))+'</button>'\n        + '</div>';'''
          new='''      const safeCode = escapeHtml(p.itemCode);\n      const desc = p.description ? '<div class="description-preview">'+escapeHtml(p.description)+'</div>' : '';\n      return '<div class="item-card'+(p.soldOut?' sold-out':'')+'" data-id="'+escapeHtml(p.id)+'">'\n        + badge + media + '<h3>'+safeName+'</h3>'\n        + '<div class="meta">'+safeSize+' · '+safeCondition+' · '+safeCategory+'</div>' + desc\n        + '<div class="price"><span class="tag-font">#'+safeCode+'</span><span class="amt">'+peso(p.price)+'</span></div>'\n        + '<button class="view-btn" data-view="'+escapeHtml(p.id)+'">View details'+(p.images.length>1?' · '+p.images.length+' photos':'')+'</button>'\n        + '<button class="add-btn" data-add="'+escapeHtml(p.id)+'" '+(p.soldOut?'disabled':'')+'>'+(p.soldOut ? 'Sold out' : (inCart ? 'Added ('+inCart+') · Add another' : 'Add to cart'))+'</button>'\n        + '</div>';'''
          assert old in s; s=s.replace(old,new,1)
          old='''    shopGrid.querySelectorAll('[data-add]').forEach(btn => {\n      btn.addEventListener('click', () => {\n        addToCart(btn.dataset.add);\n        renderShopGrid();\n      });\n    });\n  }'''
          new='''    shopGrid.querySelectorAll('[data-add]').forEach(btn => {\n      btn.addEventListener('click', event => { event.stopPropagation(); addToCart(btn.dataset.add); renderShopGrid(); });\n    });\n    shopGrid.querySelectorAll('[data-view]').forEach(btn => {\n      btn.addEventListener('click', event => { event.stopPropagation(); openProductDetails(btn.dataset.view); });\n    });\n    shopGrid.querySelectorAll('.item-card').forEach(card => {\n      card.addEventListener('click', event => { if(event.target.closest('button')) return; openProductDetails(card.dataset.id); });\n    });\n  }'''
          assert old in s; s=s.replace(old,new,1)
          anchor='''  // ---------------- TABS ----------------'''
          insert='''  // ---------------- PRODUCT DETAILS / PHOTO GALLERY ----------------\n  const productBackdrop = document.getElementById('productBackdrop');\n  const productModalBody = document.getElementById('productModalBody');\n  const closeProduct = document.getElementById('closeProduct');\n  function openProductDetails(id){\n    const p=findProduct(id); if(!p)return;\n    const images=p.images||(p.image?[p.image]:[]), safeName=escapeHtml(p.name), safeCode=escapeHtml(p.itemCode);\n    const gallery=images[0]?'<img id="productMainImage" class="product-gallery-main" src="'+escapeHtml(images[0])+'" alt="'+safeName+'">':'<div class="product-gallery-placeholder">'+iconSvg(p.category)+'</div>';\n    const thumbs=images.length>1?'<div class="product-thumbs">'+images.map((url,i)=>'<button class="product-thumb" type="button" aria-selected="'+(i===0?'true':'false')+'" data-gallery-url="'+escapeHtml(url)+'"><img src="'+escapeHtml(url)+'" alt="Photo '+(i+1)+' of '+safeName+'"></button>').join('')+'</div>':'';\n    productModalBody.innerHTML='<div><div id="productGalleryMain">'+gallery+'</div>'+thumbs+'</div><div class="product-info"><div class="tag-font">#'+safeCode+'</div><h3>'+safeName+'</h3><div class="product-price">'+peso(p.price)+'</div><div class="product-meta">'+escapeHtml(p.size)+' · '+escapeHtml(p.condition)+' · '+escapeHtml(p.category)+'</div><div class="product-description"><strong>Description / Issues / Notes</strong>'+escapeHtml(p.description||'No additional notes were provided for this item.')+'</div><button class="btn btn-primary" id="productAddBtn" '+(p.soldOut?'disabled':'')+' style="width:100%;">'+(p.soldOut?'Sold out':(cart[p.id]?'Add another to cart':'Add to cart'))+'</button></div>';\n    productBackdrop.classList.add('open'); productBackdrop.setAttribute('aria-hidden','false'); document.body.style.overflow='hidden';\n    productModalBody.querySelectorAll('[data-gallery-url]').forEach(btn=>btn.addEventListener('click',()=>{const main=document.getElementById('productMainImage');if(main)main.src=btn.dataset.galleryUrl;productModalBody.querySelectorAll('[data-gallery-url]').forEach(x=>x.setAttribute('aria-selected',x===btn?'true':'false'));}));\n    const addBtn=document.getElementById('productAddBtn'); if(addBtn&&!p.soldOut)addBtn.addEventListener('click',()=>{addToCart(p.id);renderShopGrid();openProductDetails(p.id);});\n  }\n  function closeProductDetails(){productBackdrop.classList.remove('open');productBackdrop.setAttribute('aria-hidden','true');document.body.style.overflow='';}\n  closeProduct.addEventListener('click',closeProductDetails); productBackdrop.addEventListener('click',e=>{if(e.target===productBackdrop)closeProductDetails();});\n\n  // ---------------- TABS ----------------'''
          assert anchor in s; s=s.replace(anchor,insert,1)
          old='''  document.addEventListener('keydown', event => {\n    if(event.key === 'Escape' && authBackdrop.classList.contains('open')) closeAuth();\n  });'''
          new='''  document.addEventListener('keydown', event => {\n    if(event.key !== 'Escape') return;\n    if(productBackdrop.classList.contains('open')) closeProductDetails();\n    if(authBackdrop.classList.contains('open')) closeAuth();\n  });'''
          assert old in s; s=s.replace(old,new,1)
          p.write_text(s)
          PY
          rm -f .github/workflows/datihan-buyer-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/datihan-buyer-update.yml
          git commit -m "Enhance buyer product details and gallery"
          git push
