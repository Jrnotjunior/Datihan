<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Datihan Admin</title>
<style>
*{box-sizing:border-box}:root{--ink:#171717;--paper:#f1f0ec;--line:#c9c9c3}
html,body{margin:0;min-height:100%;font-family:"Courier New",Courier,monospace;background:var(--paper);color:var(--ink)}body{font-size:14px}
.topbar{height:48px;background:#171717;color:#fff;display:flex;align-items:center;padding:0 max(28px,calc((100vw - 1240px)/2));gap:12px}.topbar .dot{width:6px;height:6px;background:#c69a2c;border-radius:50%}.topbar .crumb{font-size:13px}
.container{max-width:1240px;margin:0 auto;padding:24px 18px 70px}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding-bottom:18px;border-bottom:1px solid #b9b9b4}.eyebrow{font-size:12px;letter-spacing:1px;color:#555;margin-bottom:7px}.hero h1{margin:0;font-family:Impact,"Arial Narrow",Arial,sans-serif;font-size:56px;line-height:.95;letter-spacing:1px}.hero-actions{display:flex;gap:10px}
button{border:1px solid #333;border-radius:0;padding:11px 16px;cursor:pointer;font-family:inherit;font-weight:700;background:#f6f5f1;color:#171717}button.primary{background:#171717;color:#fff}button.danger{color:#b42318;border-color:#d59b96}button.success{background:#067647;color:#fff;border-color:#067647}button:disabled{opacity:.55;cursor:not-allowed}
.message{margin:20px 0 18px;padding:12px 14px;border:1px solid #b7d4c3;background:#f5faf6;color:#174b32;display:none}.message.show{display:block}.message.error{border-color:#e0b5b0;background:#fff7f6;color:#9b241a}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:20px 0 24px}.card{background:#f7f7f4;border:1px solid var(--line);padding:19px 20px;min-height:108px;font-size:12px;letter-spacing:1px;text-transform:uppercase}.stat-value{font-family:Impact,"Arial Narrow",Arial,sans-serif;font-size:46px;line-height:1;margin-top:14px}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:10px}.toolbar input{flex:0 1 310px;min-width:220px;padding:12px 13px;border:1px solid #bfc0ba;background:#fafaf7;font-family:inherit;font-size:14px}select{padding:12px 34px 12px 13px;border:1px solid #bfc0ba;background:#fafaf7;font-family:inherit;font-size:14px}.item-count{margin-left:auto;font-size:12px;letter-spacing:1px}
.table-wrap{background:#f8f8f5;border:1px solid var(--line);overflow:auto}table{width:100%;border-collapse:collapse;min-width:980px}th,td{text-align:left;padding:14px 12px;border-bottom:1px solid #deded9}th{background:#f3f3ef;font-size:12px;letter-spacing:1px;text-transform:uppercase}.item-cell{display:flex;align-items:center;gap:12px;min-width:220px}.item-thumb{width:44px;height:52px;border:1px solid #bbb;background:#ecece8;object-fit:cover}.item-name{font-weight:700}.status{display:inline-block;padding:5px 9px;border:1px solid;font-size:11px;font-weight:700}.status.available{background:#f0faf3;color:#067647;border-color:#a8d4b7}.status.sold{background:#fff2f1;color:#b42318;border-color:#e0aaa5}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{padding:8px 11px;font-size:12px}.empty{padding:36px!important;text-align:center!important;color:#666}
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.52);align-items:center;justify-content:center;padding:18px;z-index:50}.modal-backdrop.open{display:flex}.modal{background:#f8f8f5;border:1px solid #aaa;width:min(650px,100%);max-height:90vh;overflow:auto;padding:24px}.modal h2{margin:0 0 20px;font-family:Impact,"Arial Narrow",Arial,sans-serif;font-size:30px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field input,.field textarea{width:100%;padding:11px 12px;border:1px solid #bbb;background:#fff;font-family:inherit}.field label{font-size:12px;text-transform:uppercase;letter-spacing:.5px}.field textarea{min-height:110px;resize:vertical}.image-help{font-size:11px;color:#666}.image-preview{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}.image-preview img{width:100%;height:110px;object-fit:cover;border:1px solid #bbb}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
@media(max-width:900px){.hero h1{font-size:44px}.stats{grid-template-columns:1fr 1fr}}@media(max-width:650px){.topbar{padding:0 18px}.container{padding:20px 12px 50px}.hero{align-items:flex-start;flex-direction:column}.hero h1{font-size:38px}.hero-actions{width:100%}.hero-actions button{flex:1}.stats{grid-template-columns:1fr 1fr;gap:10px}.toolbar{flex-wrap:wrap}.toolbar input{flex:1 1 100%}.item-count{margin-left:0}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
</head>
<body>
<header class="topbar"><span class="dot"></span><span class="crumb">DATIHAN ADMIN&nbsp; / &nbsp;INVENTORY MANAGEMENT</span></header>
<div class="container">
<section class="hero"><div><div class="eyebrow">DATIHAN THRIFT SHOP</div><h1>ADMIN DASHBOARD</h1></div><div class="hero-actions"><button class="secondary" id="refreshBtn">Refresh</button><button class="primary" id="addBtn">+ Add Item</button></div></section>
<div id="message" class="message"></div>
<div class="stats"><div class="card">Total Items<div class="stat-value" id="totalItems">0</div></div><div class="card">Available<div class="stat-value" id="availableItems">0</div></div><div class="card">Sold<div class="stat-value" id="soldItems">0</div></div><div class="card">Listed Value<div class="stat-value" id="listedValue">₱0.00</div></div></div>
<div class="toolbar"><input id="search" placeholder="Search item code or name..."><select id="statusFilter"><option value="all">All status</option><option value="available">Available</option><option value="sold">Sold</option></select><span class="item-count" id="itemCount">0 ITEMS</span></div>
<div class="table-wrap"><table><thead><tr><th>Item</th><th>Code</th><th>Category</th><th>Size</th><th>Condition</th><th>Price</th><th>Status</th><th>Consignor</th><th>Actions</th></tr></thead><tbody id="inventoryBody"></tbody></table></div></div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal"><h2 id="modalTitle">Add New Item</h2><form id="itemForm"><div class="form-grid">
<div class="field"><label>Item Code</label><input id="itemCode" required></div><div class="field"><label>Item Name</label><input id="itemName" required></div><div class="field"><label>Category</label><input id="category"></div><div class="field"><label>Size</label><input id="size"></div><div class="field"><label>Condition</label><input id="condition"></div><div class="field"><label>Price (₱)</label><input id="price" type="number" min="0" step="0.01" required></div>
<div class="field full"><label>Description / Issues / Notes</label><textarea id="description" placeholder="Describe the item, flaws, stains, repairs, measurements, or anything buyers should know."></textarea></div>
<div class="field full"><label>Item Photos (1–8)</label><input id="imageFiles" type="file" accept="image/*" multiple><div class="image-help">Upload 1 to 8 photos. At least 1 photo is required for a new item.</div><div id="imagePreview" class="image-preview"></div></div>
<div class="field full"><label>Consignor ID (optional for now)</label><input id="consignorId" placeholder="UUID"></div>
</div><div class="modal-actions"><button type="button" id="cancelBtn">Cancel</button><button type="submit" class="primary" id="saveBtn">Add Item</button></div></form></div></div>
<script>
const SUPABASE_URL='https://kymtqzyatofclfaeegfw.supabase.co';
const SUPABASE_KEY='sb_publishable_2gwFi5f702YC_-py8PGxPw_z6iW67MN';
let supabaseClient=null,inventory=[],editingId=null;
const $=id=>document.getElementById(id);
const els={message:$('message'),refreshBtn:$('refreshBtn'),addBtn:$('addBtn'),search:$('search'),statusFilter:$('statusFilter'),itemCount:$('itemCount'),inventoryBody:$('inventoryBody'),totalItems:$('totalItems'),availableItems:$('availableItems'),soldItems:$('soldItems'),listedValue:$('listedValue'),modalBackdrop:$('modalBackdrop'),modalTitle:$('modalTitle'),itemForm:$('itemForm'),itemCode:$('itemCode'),itemName:$('itemName'),category:$('category'),size:$('size'),condition:$('condition'),price:$('price'),description:$('description'),imageFiles:$('imageFiles'),imagePreview:$('imagePreview'),consignorId:$('consignorId'),saveBtn:$('saveBtn'),cancelBtn:$('cancelBtn')};
function showMessage(t,type='ok'){els.message.textContent=t;els.message.className='message show '+type;clearTimeout(showMessage.t);showMessage.t=setTimeout(()=>els.message.className='message',4000)}
function money(v){return '₱'+Number(v||0).toLocaleString('en-PH',{minimumFractionDigits:2})}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function loadInventory(){if(!supabaseClient)return;const{data,error}=await supabaseClient.from('inventory').select('*').order('created_at',{ascending:false});if(error){showMessage(error.message,'error');return}inventory=data||[];render()}
function getItemImages(item){if(Array.isArray(item?.image_urls))return item.image_urls.filter(Boolean);if(typeof item?.image_urls==='string'){try{const p=JSON.parse(item.image_urls);if(Array.isArray(p))return p.filter(Boolean)}catch(e){}}return item?.image_url?[item.image_url]:[]}
function render(){const q=els.search.value.toLowerCase().trim(),f=els.statusFilter.value;const list=inventory.filter(x=>(!q||(x.item_code||'').toLowerCase().includes(q)||(x.name||'').toLowerCase().includes(q))&&(f==='all'||x.status===f));const a=inventory.filter(x=>x.status==='available');els.totalItems.textContent=inventory.length;els.availableItems.textContent=a.length;els.soldItems.textContent=inventory.filter(x=>x.status==='sold').length;els.listedValue.textContent=money(a.reduce((s,x)=>s+Number(x.price||0),0));els.itemCount.textContent=`${list.length} ITEM${list.length===1?'':'S'}`;els.inventoryBody.innerHTML=list.length?list.map(x=>{const img=getItemImages(x)[0];return `<tr><td><div class="item-cell">${img?`<img class="item-thumb" src="${esc(img)}" alt="">`:'<div class="item-thumb"></div>'}<span class="item-name">${esc(x.name)}</span></div></td><td>${esc(x.item_code)}</td><td>${esc(x.category)}</td><td>${esc(x.size)}</td><td>${esc(x.condition)}</td><td>${money(x.price)}</td><td><span class="status ${x.status}">${esc(x.status).toUpperCase()}</span></td><td>${esc(x.consignor_id||'—')}</td><td><div class="actions"><button data-action="edit" data-id="${x.id}">Edit</button>${x.status==='available'?`<button class="success" data-action="sold" data-id="${x.id}">Mark sold</button>`:`<button data-action="available" data-id="${x.id}">Mark available</button>`}<button class="danger" data-action="delete" data-id="${x.id}">Delete</button></div></td></tr>`}).join(''):`<tr><td colspan="9" class="empty">No inventory found.</td></tr>`}
function renderImagePreview(urls=[]){els.imagePreview.innerHTML=urls.length?urls.map(u=>`<img src="${esc(u)}" alt="Item photo">`).join(''):''}
function openModal(item=null){editingId=item?.id||null;els.modalTitle.textContent=item?'Edit Item':'Add New Item';els.saveBtn.textContent=item?'Save Changes':'Add Item';els.itemCode.value=item?.item_code||'';els.itemName.value=item?.name||'';els.category.value=item?.category||'';els.size.value=item?.size||'';els.condition.value=item?.condition||'';els.price.value=item?.price??'';els.description.value=item?.description||'';els.imageFiles.value='';els.consignorId.value=item?.consignor_id||'';els.imagePreview.dataset.existing=JSON.stringify(getItemImages(item));renderImagePreview(getItemImages(item));els.modalBackdrop.classList.add('open')}
function closeModal(){els.modalBackdrop.classList.remove('open')}
async function uploadImages(files,itemId){const urls=[];for(let i=0;i<files.length;i++){const file=files[i];const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const path=`${itemId}/${Date.now()}-${i}-${safe}`;const{error}=await supabaseClient.storage.from('inventory-images').upload(path,file,{upsert:false,contentType:file.type});if(error)throw error;const{data}=supabaseClient.storage.from('inventory-images').getPublicUrl(path);urls.push(data.publicUrl)}return urls}
async function saveItem(e){e.preventDefault();const files=Array.from(els.imageFiles.files||[]);const existing=JSON.parse(els.imagePreview.dataset.existing||'[]');if(files.length>8)return showMessage('Please upload a maximum of 8 photos.','error');if(!editingId&&files.length<1)return showMessage('Please upload at least 1 photo for the item.','error');const p={item_code:els.itemCode.value.trim(),name:els.itemName.value.trim(),category:els.category.value.trim()||null,size:els.size.value.trim()||null,condition:els.condition.value.trim()||null,price:Number(els.price.value),description:els.description.value.trim()||null,consignor_id:els.consignorId.value.trim()||null};els.saveBtn.disabled=true;try{if(editingId){let urls=existing.slice();if(files.length)urls=urls.concat(await uploadImages(files,editingId));if(urls.length<1)throw new Error('Please keep at least 1 photo.');p.image_urls=urls;p.image_url=urls[0];const r=await supabaseClient.from('inventory').update(p).eq('id',editingId);if(r.error)throw r.error;showMessage('Item updated.')}else{p.image_urls=[];p.image_url=null;const r=await supabaseClient.from('inventory').insert(p).select('id').single();if(r.error)throw r.error;const urls=await uploadImages(files,r.data.id);const u=await supabaseClient.from('inventory').update({image_urls:urls,image_url:urls[0]}).eq('id',r.data.id);if(u.error)throw u.error;showMessage('Item added with photos.')}closeModal();await loadInventory()}catch(err){console.error(err);showMessage('Could not save item: '+(err.message||err),'error')}finally{els.saveBtn.disabled=false}}
async function toggleSold(id,status){const{data,error}=await supabaseClient.from('inventory').update({status,sold_at:status==='sold'?new Date().toISOString():null}).eq('id',id).select('*');if(error){showMessage('Could not update status: '+error.message,'error');return}if(!data?.length){showMessage('No item was updated. Check Supabase UPDATE permissions.','error');return}showMessage(status==='sold'?'Item marked SOLD.':'Item marked AVAILABLE.');await loadInventory()}
async function deleteItem(id){const x=inventory.find(i=>i.id===id);if(!confirm(`Delete "${x?.name||'this item'}"?`))return;const{error}=await supabaseClient.from('inventory').delete().eq('id',id);if(error){showMessage(error.message,'error');return}showMessage('Item deleted.');await loadInventory()}
function editItem(id){openModal(inventory.find(x=>x.id===id))}
function bindEvents(){els.addBtn.addEventListener('click',()=>openModal());els.cancelBtn.addEventListener('click',closeModal);els.refreshBtn.addEventListener('click',loadInventory);els.search.addEventListener('input',render);els.statusFilter.addEventListener('change',render);els.itemForm.addEventListener('submit',saveItem);els.modalBackdrop.addEventListener('click',e=>{if(e.target===els.modalBackdrop)closeModal()});els.imageFiles.addEventListener('change',()=>{const files=Array.from(els.imageFiles.files||[]);if(files.length>8){showMessage('Maximum 8 photos allowed.','error');els.imageFiles.value='';renderImagePreview();return}renderImagePreview(files.map(f=>URL.createObjectURL(f)))});els.inventoryBody.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;const id=Number(b.dataset.id);const action=b.dataset.action;if(action==='edit')editItem(id);if(action==='sold')toggleSold(id,'sold');if(action==='available')toggleSold(id,'available');if(action==='delete')deleteItem(id)})}
function init(){bindEvents();const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=()=>{supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);loadInventory()};s.onerror=()=>showMessage('Could not load Supabase library.','error');document.head.appendChild(s)}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
</script>
</body></html>
