<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Datihan Admin</title>
<style>
*{box-sizing:border-box}
:root{
  --ink:#171717;
  --paper:#f1f0ec;
  --panel:#f8f8f5;
  --line:#c9c9c3;
  --muted:#5c5c58;
  --accent:#b98b22;
}
html,body{margin:0;min-height:100%;font-family:"Courier New",Courier,monospace;background:var(--paper);color:var(--ink)}
body{font-size:14px}
.topbar{
  height:48px;background:#171717;color:#fff;display:flex;align-items:center;
  padding:0 max(28px,calc((100vw - 1240px)/2));gap:12px;border-bottom:1px solid #292929
}
.topbar .dot{width:6px;height:6px;background:#c69a2c;border-radius:50%;display:inline-block;flex:0 0 auto}
.topbar .crumb{font-size:13px;letter-spacing:.3px}
.container{max-width:1240px;margin:0 auto;padding:24px 18px 70px}
.hero{
  display:flex;align-items:flex-end;justify-content:space-between;gap:24px;
  padding:0 0 18px;border-bottom:1px solid #b9b9b4
}
.eyebrow{font-size:12px;letter-spacing:1px;color:#555;margin-bottom:7px}
.hero h1{
  margin:0;font-family:Impact,"Arial Narrow",Arial,sans-serif;font-size:56px;
  line-height:.95;letter-spacing:1px;font-weight:900
}
.hero-actions{display:flex;gap:10px;align-items:center}
button{
  border:1px solid #333;border-radius:0;padding:11px 16px;cursor:pointer;
  font-family:inherit;font-weight:700;background:#f6f5f1;color:#171717
}
button.primary{background:#171717;color:#fff;border-color:#171717}
button.secondary{background:#f6f5f1;color:#171717}
button.danger{background:#f6f5f1;color:#b42318;border-color:#d59b96}
button.success{background:#067647;color:#fff;border-color:#067647}
button:disabled{opacity:.55;cursor:not-allowed}
.message{
  margin:20px 0 18px;padding:12px 14px;border:1px solid #b7d4c3;
  background:#f5faf6;color:#174b32;display:none
}
.message.show{display:block}.message.error{border-color:#e0b5b0;background:#fff7f6;color:#9b241a}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:20px 0 24px}
.card{background:#f7f7f4;border:1px solid var(--line);border-radius:0;padding:19px 20px;min-height:108px}
.card{font-size:12px;letter-spacing:1px;text-transform:uppercase}
.stat-value{font-family:Impact,"Arial Narrow",Arial,sans-serif;font-size:46px;line-height:1;margin-top:14px;letter-spacing:.5px}
.toolbar{display:flex;gap:10px;align-items:center;margin:0 0 10px}
.toolbar input{
  flex:0 1 310px;min-width:220px;padding:12px 13px;border:1px solid #bfc0ba;
  border-radius:0;background:#fafaf7;font-family:inherit;font-size:14px
}
select{
  padding:12px 34px 12px 13px;border:1px solid #bfc0ba;border-radius:0;
  background:#fafaf7;font-family:inherit;font-size:14px
}
.item-count{margin-left:auto;font-size:12px;letter-spacing:1px}
.table-wrap{background:#f8f8f5;border:1px solid var(--line);border-radius:0;overflow:auto}
table{width:100%;border-collapse:collapse;min-width:980px}
th,td{text-align:left;padding:14px 12px;border-bottom:1px solid #deded9}
th{background:#f3f3ef;font-size:12px;letter-spacing:1px;text-transform:uppercase}
tbody tr:last-child td{border-bottom:0}
.item-cell{display:flex;align-items:center;gap:12px;min-width:220px}
.item-thumb{
  width:44px;height:52px;border:1px solid #bbb;background:#ecece8;object-fit:cover;display:block
}
.item-name{font-weight:700}
.status{display:inline-block;padding:5px 9px;border:1px solid;border-radius:0;font-size:11px;font-weight:700;letter-spacing:.4px}
.status.available{background:#f0faf3;color:#067647;border-color:#a8d4b7}
.status.sold{background:#fff2f1;color:#b42318;border-color:#e0aaa5}
.actions{display:flex;gap:7px;flex-wrap:wrap}
.actions button{padding:8px 11px;font-size:12px}
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.52);align-items:center;justify-content:center;padding:18px;z-index:50}
.modal-backdrop.open{display:flex}
.modal{background:#f8f8f5;border:1px solid #aaa;width:min(650px,100%);max-height:90vh;overflow:auto;padding:24px}
.modal h2{margin:0 0 20px;font-family:Impact,"Arial Narrow",Arial,sans-serif;font-size:30px;letter-spacing:.5px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field input,.field select{width:100%;padding:11px 12px;border:1px solid #bbb;border-radius:0;background:#fff;font-family:inherit}
.field label{font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
.empty{padding:36px!important;text-align:center!important;color:#666}
@media(max-width:900px){
  .hero h1{font-size:44px}.stats{grid-template-columns:1fr 1fr}
}
@media(max-width:650px){
  .topbar{padding:0 18px}.container{padding:20px 12px 50px}
  .hero{align-items:flex-start;flex-direction:column}.hero h1{font-size:38px}
  .hero-actions{width:100%}.hero-actions button{flex:1}
  .stats{grid-template-columns:1fr 1fr;gap:10px}.card{min-height:95px;padding:14px}
  .stat-value{font-size:36px}.toolbar{flex-wrap:wrap}.toolbar input{flex:1 1 100%}.item-count{margin-left:0}
  .form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}
}
</style>
</head>
<body>
<header class="topbar">
      <span class="dot"></span>
      <span class="crumb">DATIHAN ADMIN&nbsp; / &nbsp;INVENTORY MANAGEMENT</span>
    </header>
<div class="container">
<section class="hero">
  <div>
    <div class="eyebrow">DATIHAN THRIFT SHOP</div>
    <h1>ADMIN DASHBOARD</h1>
  </div>
  <div class="hero-actions">
    <button class="secondary" id="refreshBtn">Refresh</button>
    <button class="primary" id="addBtn">+ Add Item</button>
  </div>
</section>
<div id="message" class="message"></div>
<div class="stats">
<div class="card">Total Items<div class="stat-value" id="totalItems">0</div></div>
<div class="card">Available<div class="stat-value" id="availableItems">0</div></div>
<div class="card">Sold<div class="stat-value" id="soldItems">0</div></div>
<div class="card">Listed Value<div class="stat-value" id="listedValue">₱0.00</div></div>
</div>
<div class="toolbar">
  <input id="search" placeholder="Search item code or name...">
  <select id="statusFilter"><option value="all">All status</option><option value="available">Available</option><option value="sold">Sold</option></select>
  <span class="item-count" id="itemCount">0 ITEMS</span>
</div>
<div class="table-wrap"><table><thead><tr><th>Item</th><th>Code</th><th>Category</th><th>Size</th><th>Condition</th><th>Price</th><th>Status</th><th>Consignor</th><th>Actions</th></tr></thead>
<tbody id="inventoryBody"></tbody></table></div></div>

<div class="modal-backdrop" id="modalBackdrop"><div class="modal"><h2 id="modalTitle">Add New Item</h2>
<form id="itemForm"><div class="form-grid">
<div class="field"><label>Item Code</label><input id="itemCode" required></div>
<div class="field"><label>Item Name</label><input id="itemName" required></div>
<div class="field"><label>Category</label><input id="category"></div>
<div class="field"><label>Size</label><input id="size"></div>
<div class="field"><label>Condition</label><input id="condition"></div>
<div class="field"><label>Price (₱)</label><input id="price" type="number" min="0" step="0.01" required></div>
<div class="field full"><label>Image URL</label><input id="imageUrl" placeholder="https://..."></div>
<div class="field full"><label>Consignor ID (optional for now)</label><input id="consignorId" placeholder="UUID"></div>
</div><div class="modal-actions"><button type="button" class="secondary" id="cancelBtn">Cancel</button><button type="submit" class="primary" id="saveBtn">Add Item</button></div>
</form></div></div>

<script>
const SUPABASE_URL='https://kymtqzyatofclfaeegfw.supabase.co';
const SUPABASE_KEY='sb_publishable_2gwFi5f702YC_-py8PGxPw_z6iW67MN';
let supabaseClient,inventory=[],editingId=null;

function showMessage(t,type='ok'){const e=document.getElementById('message');e.textContent=t;e.className='message show '+type;clearTimeout(showMessage.t);showMessage.t=setTimeout(()=>e.className='message',3500)}
function money(v){return '₱'+Number(v||0).toLocaleString('en-PH',{minimumFractionDigits:2})}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]) )}
async function loadInventory(){const{data,error}=await supabaseClient.from('inventory').select('*').order('created_at',{ascending:false});if(error){showMessage(error.message,'error');return}inventory=data||[];render()}
function render(){
const q=document.getElementById('search').value.toLowerCase().trim(),f=document.getElementById('statusFilter').value;
const list=inventory.filter(x=>(!q||(x.item_code||'').toLowerCase().includes(q)||(x.name||'').toLowerCase().includes(q))&&(f==='all'||x.status===f));
const a=inventory.filter(x=>x.status==='available');
document.getElementById('totalItems').textContent=inventory.length;
document.getElementById('availableItems').textContent=a.length;
document.getElementById('soldItems').textContent=inventory.filter(x=>x.status==='sold').length;
document.getElementById('listedValue').textContent=money(a.reduce((s,x)=>s+Number(x.price||0),0));
document.getElementById('itemCount').textContent=`${list.length} ITEM${list.length===1?'':'S'}`;
document.getElementById('inventoryBody').innerHTML=list.length?list.map(x=>`
<tr>
<td><div class="item-cell">${x.image_url?`<img class="item-thumb" src="${esc(x.image_url)}" alt="">`:`<div class="item-thumb"></div>`}<span class="item-name">${esc(x.name)}</span></div></td>
<td>${esc(x.item_code)}</td><td>${esc(x.category)}</td><td>${esc(x.size)}</td><td>${esc(x.condition)}</td>
<td>${money(x.price)}</td>
<td><span class="status ${x.status}">${esc(x.status).toUpperCase()}</span></td>
<td>${esc(x.consignor_id||'—')}</td>
<td><div class="actions"><button class="secondary" onclick="editItem(${x.id})">Edit</button>${x.status==='available'?`<button class="success" onclick="toggleSold(${x.id},'sold')">Mark sold</button>`:`<button class="secondary" onclick="toggleSold(${x.id},'available')">Mark available</button>`}<button class="danger" onclick="deleteItem(${x.id})">Delete</button></div></td>
</tr>`).join(''):`<tr><td colspan="9" class="empty">No inventory found.</td></tr>`;
}
function openModal(item=null){editingId=item?.id||null;document.getElementById('modalTitle').textContent=item?'Edit Item':'Add New Item';document.getElementById('saveBtn').textContent=item?'Save Changes':'Add Item';
document.getElementById('itemCode').value=item?.item_code||'';document.getElementById('itemName').value=item?.name||'';document.getElementById('category').value=item?.category||'';document.getElementById('size').value=item?.size||'';document.getElementById('condition').value=item?.condition||'';document.getElementById('price').value=item?.price??'';document.getElementById('imageUrl').value=item?.image_url||'';document.getElementById('consignorId').value=item?.consignor_id||'';document.getElementById('modalBackdrop').classList.add('open')}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('open')}
async function saveItem(e){e.preventDefault();const p={item_code:itemCode.value.trim(),name:itemName.value.trim(),category:category.value.trim()||null,size:size.value.trim()||null,condition:condition.value.trim()||null,price:Number(price.value),image_url:imageUrl.value.trim()||null,consignor_id:consignorId.value.trim()||null};saveBtn.disabled=true;
const r=editingId?await supabaseClient.from('inventory').update(p).eq('id',editingId):await supabaseClient.from('inventory').insert(p);saveBtn.disabled=false;if(r.error){showMessage(r.error.message,'error');return}closeModal();showMessage(editingId?'Item updated.':'Item added.');loadInventory()}
window.editItem=id=>openModal(inventory.find(x=>x.id===id));
window.toggleSold=async(id,status)=>{
  const updateData={status:status,sold_at:status==='sold'?new Date().toISOString():null};
  const {data,error}=await supabaseClient.from('inventory').update(updateData).eq('id',id).select();
  if(error){console.error('Mark sold error:',error);showMessage(error.message,'error');return}
  console.log('Inventory updated:',data);
  showMessage(status==='sold'?'Item marked SOLD.':'Item marked AVAILABLE.');
  await loadInventory();
};
window.deleteItem=async id=>{const x=inventory.find(i=>i.id===id);if(!confirm(`Delete "${x?.name||'this item'}"?`))return;const{error}=await supabaseClient.from('inventory').delete().eq('id',id);if(error){showMessage(error.message,'error');return}showMessage('Item deleted.');loadInventory()};
addBtn.onclick=()=>openModal();cancelBtn.onclick=closeModal;refreshBtn.onclick=loadInventory;search.oninput=render;statusFilter.onchange=render;itemForm.onsubmit=saveItem;modalBackdrop.onclick=e=>{if(e.target.id==='modalBackdrop')closeModal};
const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=()=>{supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);loadInventory()};document.head.appendChild(s);
</script>
</body></html>
