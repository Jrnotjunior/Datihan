<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Datihan Shop Owner</title>
<style>
*{box-sizing:border-box}:root{--ink:#171717;--paper:#f1f0ec;--line:#c9c9c3}html,body{margin:0;min-height:100%;font-family:"Courier New",Courier,monospace;background:var(--paper);color:var(--ink)}body{font-size:14px}.topbar{height:48px;background:#171717;color:#fff;display:flex;align-items:center;padding:0 max(28px,calc((100vw - 1240px)/2));gap:12px;border-bottom:1px solid #292929}.dot{width:6px;height:6px;background:#c69a2c;border-radius:50%}.crumb{font-size:13px}.container{max-width:1240px;margin:auto;padding:24px 18px 70px}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding-bottom:18px;border-bottom:1px solid #b9b9b4}.eyebrow{font-size:12px;letter-spacing:1px;color:#555;margin-bottom:7px}.hero h1{margin:0;font-family:Impact,"Arial Narrow",Arial,sans-serif;font-size:56px;line-height:.95;letter-spacing:1px}.hero-actions{display:flex;gap:10px}button{border:1px solid #333;border-radius:0;padding:11px 16px;cursor:pointer;font-family:inherit;font-weight:700;background:#f6f5f1;color:#171717}button.primary{background:#171717;color:#fff}button.success{background:#067647;color:#fff;border-color:#067647}button.danger{color:#b42318;border-color:#d59b96}button:disabled{opacity:.55;cursor:not-allowed}.message{margin:20px 0 18px;padding:12px 14px;border:1px solid #b7d4c3;background:#f5faf6;color:#174b32;display:none}.message.show{display:block}.message.error{border-color:#e0b5b0;background:#fff7f6;color:#9b241a}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:20px 0 24px}.card{background:#f7f7f4;border:1px solid var(--line);padding:19px 20px;min-height:108px;font-size:12px;letter-spacing:1px;text-transform:uppercase}.stat-value{font-family:Impact,"Arial Narrow",Arial,sans-serif;font-size:46px;margin-top:14px}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:10px}.toolbar input{flex:0 1 310px;min-width:220px;padding:12px 13px;border:1px solid #bfc0ba;background:#fafaf7;font:14px "Courier New",monospace}.toolbar select{padding:12px 34px 12px 13px;border:1px solid #bfc0ba;background:#fafaf7;font:14px "Courier New",monospace}.item-count{margin-left:auto;font-size:12px;letter-spacing:1px}.table-wrap{background:#f8f8f5;border:1px solid var(--line);overflow:auto}table{width:100%;border-collapse:collapse;min-width:980px}th,td{text-align:left;padding:14px 12px;border-bottom:1px solid #deded9}th{background:#f3f3ef;font-size:12px;letter-spacing:1px;text-transform:uppercase}.item-cell{display:flex;align-items:center;gap:12px;min-width:220px}.item-thumb{width:44px;height:52px;border:1px solid #bbb;background:#ecece8;object-fit:cover}.item-name{font-weight:700}.status{display:inline-block;padding:5px 9px;border:1px solid;font-size:11px;font-weight:700}.status.available{background:#f0faf3;color:#067647;border-color:#a8d4b7}.status.sold{background:#fff2f1;color:#b42318;border-color:#e0aaa5}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{padding:8px 11px;font-size:12px}.empty{padding:36px!important;text-align:center!important;color:#666}.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.52);align-items:center;justify-content:center;padding:18px;z-index:50}.modal-backdrop.open{display:flex}.modal{background:#f8f8f5;border:1px solid #aaa;width:min(650px,100%);max-height:90vh;overflow:auto;padding:24px;position:fixed}.modal h2{margin:0 0 20px;font-family:Impact,"Arial Narrow",Arial,sans-serif;font-size:30px;cursor:move;user-select:none}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field input,.field textarea{width:100%;padding:11px 12px;border:1px solid #bbb;background:#fff;font-family:inherit}.field label{font-size:12px;text-transform:uppercase}.field textarea{min-height:110px;resize:vertical}.image-help{font-size:11px;color:#666;margin-top:4px}.image-preview{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}.image-preview img{width:100%;height:110px;object-fit:cover;border:1px solid #bbb}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}@media(max-width:900px){.hero h1{font-size:44px}.stats{grid-template-columns:1fr 1fr}}@media(max-width:650px){.container{padding:20px 12px 50px}.hero{align-items:flex-start;flex-direction:column}.hero h1{font-size:38px}.hero-actions{width:100%}.hero-actions button{flex:1}.stats{grid-template-columns:1fr 1fr;gap:10px}.toolbar{flex-wrap:wrap}.toolbar input{flex:1 1 100%}.item-count{margin-left:0}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
</head>
<body>
<header class="topbar"><span class="dot"></span><span class="crumb">DATIHAN SHOP OWNER&nbsp; / &nbsp;INVENTORY MANAGEMENT</span></header>
<div class="container">
<section class="hero"><div><div class="eyebrow">DATIHAN THRIFT SHOP</div><h1>SHOP OWNER</h1></div><div class="hero-actions"><button id="storeBtn">View Store</button><button id="signOutBtn">Sign Out</button><button class="primary" id="addBtn">+ Add Item</button></div></section>
<div id="message" class="message"></div>
<div class="stats"><div class="card">Total Items<div class="stat-value" id="totalItems">0</div></div><div class="card">Available<div class="stat-value" id="availableItems">0</div></div><div class="card">Sold<div class="stat-value" id="soldItems">0</div></div><div class="card">Listed Value<div class="stat-value" id="listedValue">₱0.00</div></div></div>
<div class="toolbar"><input id="search" placeholder="Search item code or name..."><select id="statusFilter"><option value="all">All status</option><option value="available">Available</option><option value="sold">Sold</option></select><span class="item-count" id="itemCount">0 ITEMS</span></div>
<div class="table-wrap"><table><thead><tr><th>Item</th><th>Code</th><th>Category</th><th>Size</th><th>Condition</th><th>Price</th><th>Status</th><th>Consignor</th><th>Actions</th></tr></thead><tbody id="inventoryBody"></tbody></table></div>
</div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modal"><h2 id="modalTitle">Add New Item</h2><form id="itemForm"><div class="form-grid"><div class="field"><label>Item Code</label><input id="itemCode" required></div><div class="field"><label>Item Name</label><input id="itemName" required></div><div class="field"><label>Category</label><input id="category"></div><div class="field"><label>Size</label><input id="size"></div><div class="field"><label>Condition</label><input id="condition"></div><div class="field"><label>Price (₱)</label><input id="price" type="number" min="0" step="0.01" required></div><div class="field full"><label>Description / Issues / Notes</label><textarea id="description" placeholder="Describe flaws, stains, repairs, measurements, or anything buyers should know."></textarea></div><div class="field full"><label>Item Photos (1–8)</label><input id="imageFiles" type="file" accept="image/*" multiple><div class="image-help">Upload 1 to 8 photos. At least 1 photo is required for a new item.</div><div id="imagePreview" class="image-preview"></div></div><div class="field full"><label>Consignor ID (optional for now)</label><input id="consignorId" placeholder="UUID"></div></div><div class="modal-actions"><button type="button" id="cancelBtn">Cancel</button><button type="submit" class="primary" id="saveBtn">Add Item</button></div></form></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://kymtqzyatofclfaeegfw.supabase.co',SUPABASE_KEY='sb_publishable_2gwFi5f702YC_-py8PGxPw_z6iW67MN';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let inventory=[],editingId=null;const $=id=>document.getElementById(id);
const el={message:$('message'),search:$('search'),filter:$('statusFilter'),body:$('inventoryBody'),total:$('totalItems'),available:$('availableItems'),sold:$('soldItems'),value:$('listedValue'),modal:$('modalBackdrop'),modalBox:$('modal'),title:$('modalTitle'),form:$('itemForm'),code:$('itemCode'),name:$('itemName'),category:$('category'),size:$('size'),condition:$('condition'),price:$('price'),description:$('description'),files:$('imageFiles'),preview:$('imagePreview'),consignor:$('consignorId'),save:$('saveBtn')};
function msg(t,type='ok'){el.message.textContent=t;el.message.className='message show '+type;clearTimeout(msg.t);msg.t=setTimeout(()=>el.message.className='message',4500)}
function money(v){return '₱'+Number(v||0).toLocaleString('en-PH',{minimumFractionDigits:2})}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function images(x){if(Array.isArray(x?.image_urls))return x.image_urls.filter(Boolean);if(typeof x?.image_urls==='string'){try{const a=JSON.parse(x.image_urls);if(Array.isArray(a))return a.filter(Boolean)}catch(e){}}return x?.image_url?[x.image_url]:[]}
async function load(){const{data,error}=await sb.from('inventory').select('*').order('created_at',{ascending:false});if(error)return msg(error.message,'error');inventory=data||[];render()}
function render(){const q=el.search.value.toLowerCase().trim(),f=el.filter.value,list=inventory.filter(x=>(!q||(x.item_code||'').toLowerCase().includes(q)||(x.name||'').toLowerCase().includes(q))&&(f==='all'||x.status===f)),a=inventory.filter(x=>x.status==='available');el.total.textContent=inventory.length;el.available.textContent=a.length;el.sold.textContent=inventory.filter(x=>x.status==='sold').length;el.value.textContent=money(a.reduce((s,x)=>s+Number(x.price||0),0));el.itemCount.textContent=`${list.length} ITEM${list.length===1?'':'S'}`;el.body.innerHTML=list.length?list.map(x=>{const im=images(x)[0];return `<tr><td><div class="item-cell">${im?`<img class="item-thumb" src="${esc(im)}">`:'<div class="item-thumb"></div>'}<span class="item-name">${esc(x.name)}</span></div></td><td>${esc(x.item_code)}</td><td>${esc(x.category)}</td><td>${esc(x.size)}</td><td>${esc(x.condition)}</td><td>${money(x.price)}</td><td><span class="status ${x.status}">${esc(x.status).toUpperCase()}</span></td><td>${esc(x.consignor_id||'—')}</td><td><div class="actions"><button data-a="edit" data-id="${x.id}">Edit</button>${x.status==='available'?`<button class="success" data-a="sold" data-id="${x.id}">Mark sold</button>`:`<button data-a="available" data-id="${x.id}">Mark available</button>`}<button class="danger" data-a="delete" data-id="${x.id}">Delete</button></div></td></tr>`}).join(''):'<tr><td colspan="9" class="empty">No inventory found.</td></tr>'}
function preview(urls){el.preview.innerHTML=urls.map(u=>`<img src="${esc(u)}" alt="Item photo">`).join('')}
function open(item=null){editingId=item?.id||null;el.title.textContent=item?'Edit Item':'Add New Item';el.save.textContent=item?'Save Changes':'Add Item';el.code.value=item?.item_code||'';el.name.value=item?.name||'';el.category.value=item?.category||'';el.size.value=item?.size||'';el.condition.value=item?.condition||'';el.price.value=item?.price??'';el.description.value=item?.description||'';el.consignor.value=item?.consignor_id||'';el.files.value='';el.preview.dataset.existing=JSON.stringify(images(item));preview(images(item));el.modal.classList.add('open');resetPos()}
function close(){el.modal.classList.remove('open')}
function resetPos(){el.modalBox.style.left='50%';el.modalBox.style.top='50%';el.modalBox.style.transform='translate(-50%,-50%)'}
let drag=false,sx=0,sy=0,sl=0,st=0;el.title.addEventListener('pointerdown',e=>{drag=true;const r=el.modalBox.getBoundingClientRect();sx=e.clientX;sy=e.clientY;sl=r.left;st=r.top;el.modalBox.style.transform='none';el.title.setPointerCapture?.(e.pointerId);e.preventDefault()});el.title.addEventListener('pointermove',e=>{if(!drag)return;el.modalBox.style.left=Math.min(innerWidth-el.modalBox.offsetWidth,Math.max(0,sl+e.clientX-sx))+'px';el.modalBox.style.top=Math.min(innerHeight-el.modalBox.offsetHeight,Math.max(0,st+e.clientY-sy))+'px'});['pointerup','pointercancel'].forEach(x=>el.title.addEventListener(x,()=>drag=false));
async function upload(files,id){const urls=[];for(let i=0;i<files.length;i++){const file=files[i],safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_'),path=`${id}/${Date.now()}-${i}-${safe}`,r=await sb.storage.from('inventory-images').upload(path,file,{upsert:false,contentType:file.type||undefined});if(r.error)throw r.error;urls.push(sb.storage.from('inventory-images').getPublicUrl(path).data.publicUrl)}return urls}
async function save(e){e.preventDefault();const files=[...el.files.files],existing=JSON.parse(el.preview.dataset.existing||'[]');if(files.length>8)return msg('Please upload a maximum of 8 photos.','error');if(!editingId&&files.length<1)return msg('Please upload at least 1 photo for the item.','error');el.save.disabled=true;try{const p={item_code:el.code.value.trim(),name:el.name.value.trim(),category:el.category.value.trim()||null,size:el.size.value.trim()||null,condition:el.condition.value.trim()||null,price:Number(el.price.value),description:el.description.value.trim()||null,consignor_id:el.consignor.value.trim()||null};if(editingId){let urls=existing;if(files.length)urls=urls.concat(await upload(files,editingId));if(!urls.length)throw new Error('Please keep at least 1 photo for this item.');p.image_urls=urls;p.image_url=urls[0];const r=await sb.from('inventory').update(p).eq('id',editingId);if(r.error)throw r.error;msg('Item updated.')}else{p.image_urls=[];p.image_url=null;const r=await sb.from('inventory').insert(p).select('id').single();if(r.error)throw r.error;const urls=await upload(files,r.data.id),u=await sb.from('inventory').update({image_urls:urls,image_url:urls[0]}).eq('id',r.data.id);if(u.error)throw u.error;msg('Item added with photos.')}close();await load()}catch(e){console.error(e);msg('Could not save item: '+(e.message||e),'error')}finally{el.save.disabled=false}}
async function status(id,s){const{data,error}=await sb.from('inventory').update({status:s,sold_at:s==='sold'?new Date().toISOString():null}).eq('id',id).select('*');if(error)return msg('Could not update status: '+error.message,'error');if(!data?.length)return msg('No item was updated. Check Supabase UPDATE permissions.','error');msg(s==='sold'?'Item marked SOLD.':'Item marked AVAILABLE.');load()}
async function del(id){const x=inventory.find(i=>String(i.id)===String(id));if(!confirm(`Delete "${x?.name||'this item'}"?`))return;const{error}=await sb.from('inventory').delete().eq('id',id);if(error)return msg(error.message,'error');msg('Item deleted.');load()}
el.body.onclick=e=>{const b=e.target.closest('button[data-a]');if(!b)return;const x=inventory.find(i=>String(i.id)===String(b.dataset.id));if(b.dataset.a==='edit')open(x);else if(b.dataset.a==='sold')status(b.dataset.id,'sold');else if(b.dataset.a==='available')status(b.dataset.id,'available');else if(b.dataset.a==='delete')del(b.dataset.id)};
el.files.onchange=()=>{const f=[...el.files.files];if(f.length>8){msg('Maximum 8 photos allowed.','error');el.files.value='';return}preview(f.map(x=>URL.createObjectURL(x)))};el.form.onsubmit=save;el.search.oninput=render;el.filter.onchange=render;document.getElementById('addBtn').onclick=()=>open();document.getElementById('cancelBtn').onclick=close;el.modal.onclick=e=>{if(e.target===el.modal)close()};document.getElementById('storeBtn').onclick=()=>location.href='index.html';document.getElementById('signOutBtn').onclick=async()=>{await sb.auth.signOut();location.href='login.html'};
(async()=>{const{data:{user}}=await sb.auth.getUser();if(!user){location.href='login.html';return}const{data:profile,error}=await sb.from('profiles').select('role').eq('id',user.id).single();if(error||profile?.role!=='shop_owner'){location.href=profile?.role==='admin'?'admin.html':'index.html';return}await load()})();
</script>
</body></html>
