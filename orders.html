<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Datihan — My Orders</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f0ec;color:#171717;font-family:"Courier New",monospace}.wrap{max-width:1000px;margin:auto;padding:28px 18px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;border-bottom:1px solid #aaa;padding-bottom:18px}.eyebrow{font-size:12px;letter-spacing:1px;color:#555}.top h1{margin:5px 0 0;font-family:Impact,Arial,sans-serif;font-size:44px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid #333;background:#171717;color:#fff;padding:10px 14px;font:700 13px "Courier New",monospace;cursor:pointer}.btn.light{background:#f8f8f5;color:#171717}.btn:hover{opacity:.85}.message{margin:18px 0;padding:12px;border:1px solid #b7d4c3;background:#f5faf6;color:#174b32;display:none}.message.show{display:block}.message.error{border-color:#e0b5b0;background:#fff7f6;color:#9b241a}.order{background:#f8f8f5;border:1px solid #c9c9c3;margin:14px 0;padding:18px}.order-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;border-bottom:1px solid #ddd;padding-bottom:12px}.order-id{font-weight:700}.date{font-size:12px;color:#666}.status{display:inline-block;padding:5px 9px;border:1px solid #aaa;font-size:11px;font-weight:700;text-transform:uppercase}.status.pending{background:#fff8e8;border-color:#d9bd77;color:#8a5a00}.status.confirmed{background:#f0faf3;border-color:#a8d4b7;color:#067647}.status.completed{background:#eef4ff;border-color:#a8bfdc;color:#24507a}.status.cancelled{background:#fff2f1;border-color:#e0aaa5;color:#b42318}.item{display:flex;gap:14px;padding-top:15px;align-items:center}.item img{width:72px;height:88px;object-fit:cover;border:1px solid #bbb;background:#eee}.item h2{margin:0 0 6px;font-size:18px}.meta{font-size:12px;color:#555}.price{font-weight:700;margin-top:8px}.empty{text-align:center;padding:50px 20px;color:#666;border:1px solid #c9c9c3;background:#f8f8f5}.loading{text-align:center;padding:50px 20px;color:#666;border:1px solid #c9c9c3;background:#f8f8f5}@media(max-width:650px){.top{align-items:flex-start;flex-direction:column}.top h1{font-size:36px}.order-head{flex-direction:column}}
</style>
</head>
<body>
<main class="wrap">
<header class="top">
  <div><div class="eyebrow">DATIHAN THRIFT SHOP / BUYER</div><h1>MY ORDERS</h1></div>
  <div class="actions">
    <button type="button" class="btn light" id="storeBtn">Back to Store</button>
    <button type="button" class="btn" id="signOutBtn">Sign Out</button>
  </div>
</header>
<div id="message" class="message"></div>
<section id="orders"><div class="loading">Loading your orders...</div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  'use strict';
  const SUPABASE_URL='https://kymtqzyatofclfaeegfw.supabase.co';
  const SUPABASE_KEY='sb_publishable_2gwFi5f702YC_-py8PGxPw_z6iW67MN';
  const $=id=>document.getElementById(id);
  let db=null;
  let loading=false;

  $('storeBtn').addEventListener('click',function(){ window.location.href='index.html'; });
  $('signOutBtn').addEventListener('click',async function(){
    const btn=this;
    btn.disabled=true;
    btn.textContent='Signing out...';
    try{
      if(db) await db.auth.signOut();
    }finally{
      window.location.href='login.html';
    }
  });

  function esc(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]||c));}
  function msg(t,error=false){$('message').textContent=t;$('message').className='message show'+(error?' error':'');}
  function statusClass(s){const v=String(s||'pending').toLowerCase();return ['pending','confirmed','completed','cancelled'].includes(v)?v:'pending';}

  function render(rows){
    if(!rows.length){$('orders').innerHTML='<div class="empty">You have no orders yet.</div>';return;}
    $('orders').innerHTML=rows.map(o=>{
      const p=o.inventory||{};
      const image=p.image_url||(Array.isArray(p.image_urls)?p.image_urls[0]:'');
      return `<article class="order"><div class="order-head"><div><div class="order-id">ORDER #${esc(o.id)}</div><div class="date">${new Date(o.created_at).toLocaleString()}</div></div><span class="status ${statusClass(o.status)}">${esc(o.status||'pending')}</span></div><div class="item">${image?`<img src="${esc(image)}" alt="">`:''}<div><h2>${esc(p.name||'Item')}</h2><div class="meta">Code: ${esc(p.item_code||p.id||o.inventory_id)}</div><div class="price">₱${Number(p.price||0).toLocaleString('en-PH',{minimumFractionDigits:2})}</div></div></div></article>`;
    }).join('');
  }

  async function load(){
    if(loading || !db) return;
    loading=true;
    try{
      const {data:{session},error:sessionError}=await db.auth.getSession();
      if(sessionError) throw sessionError;
      if(!session||!session.user){window.location.href='login.html';return;}

      const {data:orders,error:ordersError}=await db.from('orders')
        .select('id,buyer_id,inventory_id,status,created_at')
        .eq('buyer_id',session.user.id)
        .order('created_at',{ascending:false});
      if(ordersError) throw ordersError;

      if(!orders||!orders.length){render([]);return;}

      const ids=[...new Set(orders.map(o=>o.inventory_id).filter(v=>v!==null&&v!==undefined))];
      let inventory=[];
      if(ids.length){
        const {data:items,error:inventoryError}=await db.from('inventory')
          .select('id,item_code,name,price,image_url,image_urls,status')
          .in('id',ids);
        if(inventoryError) throw inventoryError;
        inventory=items||[];
      }
      const byId=new Map(inventory.map(item=>[String(item.id),item]));
      render(orders.map(o=>({...o,inventory:byId.get(String(o.inventory_id))||null})));
      $('message').className='message';
    }catch(error){
      console.error('My Orders load error:',error);
      msg('Could not load your orders: '+(error?.message||error),true);
    }finally{
      loading=false;
    }
  }

  function start(){
    if(!window.supabase||!window.supabase.createClient){msg('Supabase library could not be loaded. Please refresh the page.',true);return;}
    db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    load();
    db.channel('buyer-orders-page')
      .on('postgres_changes',{event:'*',schema:'public',table:'orders'},function(){load();})
      .subscribe();
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start,{once:true});
  else start();
})();
</script>
<script src="js/page-loader.js"></script>
</body>
</html>
