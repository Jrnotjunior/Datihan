<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Datihan — Shop</title>
<style>
:root{--bg:#E6E6E2;--panel:#F4F4F1;--ink:#1B1B1A;--muted:#58564F;--line:rgba(27,27,26,.16);--accent:#A63B2C;--gold:#B8942F}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:1120px;margin:auto;padding:0 20px}.top{border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(230,230,226,.94);backdrop-filter:blur(8px);z-index:5}.nav{height:72px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;letter-spacing:2px}.admin{font-size:13px;text-decoration:none;color:var(--ink);border:1px solid var(--ink);padding:9px 14px}.hero{padding:48px 0 28px;border-bottom:1px solid var(--line)}h1{font-size:clamp(42px,7vw,78px);line-height:.9;margin:0;text-transform:uppercase}.sub{color:var(--muted);max-width:600px;margin-top:16px}.tools{display:flex;gap:10px;margin:24px 0;flex-wrap:wrap}.tools input{flex:1;min-width:220px;padding:13px;border:1px solid var(--line);background:var(--panel);font-size:15px}.tools select{padding:13px;border:1px solid var(--line);background:var(--panel)}.status{font-size:12px;color:var(--muted);align-self:center}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;padding:10px 0 60px}@media(max-width:950px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.grid{grid-template-columns:1fr}}.card{background:var(--panel);border:1px solid var(--line);position:relative;overflow:hidden}.photo{width:100%;aspect-ratio:1;object-fit:cover;background:#ddd}.body{padding:15px}.name{font-weight:700;font-size:16px}.meta{font-size:12px;color:var(--muted);margin-top:5px}.price{font-family:monospace;color:var(--accent);font-size:16px;margin-top:12px}.badge{position:absolute;top:10px;left:10px;background:var(--gold);padding:4px 8px;font:11px monospace}.sold{background:var(--ink);color:#fff}.desc{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.45}.empty{padding:50px;text-align:center;color:var(--muted);grid-column:1/-1}.err{padding:16px;border:1px solid #c88;background:#fff5f4;color:#8d2419;margin:20px 0;display:none}
</style>
</head>
<body>
<header class="top"><div class="wrap nav"><div class="brand">DATIHAN</div><a class="admin" href="admin.html">ADMIN</a></div></header>
<main class="wrap"><section class="hero"><h1>Shop the Drop</h1><div class="sub">Browse Datihan's live thrift inventory. Items added or marked sold in the admin dashboard are reflected here automatically.</div></section><div id="err" class="err"></div><div class="tools"><input id="search" placeholder="Search items..."><select id="category"><option value="all">All categories</option></select><span class="status" id="status">Loading inventory…</span></div><section class="grid" id="grid"></section></main>
<script>
const SUPABASE_URL='https://kymtqzyatofclfaeegfw.supabase.co';const SUPABASE_KEY='sb_publishable_2gwFi5f702YC_-py8PGxPw_z6iW67MN';let db,items=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const money=v=>'₱'+Number(v||0).toLocaleString('en-PH',{minimumFractionDigits:2});
function images(x){if(Array.isArray(x.image_urls))return x.image_urls.filter(Boolean);if(typeof x.image_urls==='string'){try{const a=JSON.parse(x.image_urls);if(Array.isArray(a))return a.filter(Boolean)}catch(e){}}return x.image_url?[x.image_url]:[]}
function render(){const q=search.value.toLowerCase().trim(),cat=category.value;const list=items.filter(x=>(!q||(x.name||'').toLowerCase().includes(q)||(x.item_code||'').toLowerCase().includes(q)||(x.description||'').toLowerCase().includes(q))&&(cat==='all'||x.category===cat));status.textContent=`${list.length} item${list.length===1?'':'s'} shown`;grid.innerHTML=list.length?list.map(x=>{const photo=images(x)[0];return `<article class="card"><span class="badge ${x.status==='sold'?'sold':''}">${x.status==='sold'?'SOLD':'AVAILABLE'}</span>${photo?`<img class="photo" src="${esc(photo)}" alt="${esc(x.name)}">`:`<div class="photo"></div>`}<div class="body"><div class="name">${esc(x.name)}</div><div class="meta">${esc(x.category||'')} ${x.size?'· '+esc(x.size):''} ${x.condition?'· '+esc(x.condition):''}</div><div class="price">${money(x.price)}</div>${x.description?`<div class="desc">${esc(x.description)}</div>`:''}</div></article>`}).join(''):`<div class="empty">No available items match your search.</div>`}
async function load(){const{data,error}=await db.from('inventory').select('id,item_code,name,category,size,condition,price,image_url,image_urls,description,status,created_at').order('created_at',{ascending:false});if(error){err.style.display='block';err.textContent='Could not load inventory: '+error.message;status.textContent='Inventory unavailable';return}items=data||[];const cats=[...new Set(items.map(x=>x.category).filter(Boolean))].sort();category.innerHTML='<option value="all">All categories</option>'+cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');render()}
search.oninput=render;category.onchange=render;const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=()=>{db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);load()};document.head.appendChild(s);
</script>
</body>
</html>
